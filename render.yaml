services:
  - type: web
    name: web2-seguridad-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: web2-seguridad-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: web2-seguridad-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: web2-seguridad-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: web2-seguridad-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: web2-seguridad-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC

databases:
  - name: web2-seguridad-db
    databaseName: web2_seguridad
    user: web2_user
    plan: free
    region: ohio
