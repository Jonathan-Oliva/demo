spring.application.name=demo
spring.jackson.deserialization.fail-on-null-for-primitives=false
server.port=${PORT:8080}
server.address=0.0.0.0

# API externa que se va a consumir para el catálogo de productos
app.dummyjson.base-url=https://dummyjson.com

# Base de datos (ver docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:webii_tp2}}
spring.datasource.username=${DB_USERNAME:webii_tp2}
spring.datasource.password=${DB_PASSWORD:webii_tp2}

# Clave local de desarrollo; en otros entornos definir JWT_SECRET.
app.jwt.secret=${JWT_SECRET:clave-local-de-desarrollo-cambiar-en-otros-entornos-2026}

# El esquema lo maneja Flyway, no Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Permite aplicar V2-V4 si V5 ya se ejecutó en una base local de la rama anterior.
spring.flyway.out-of-order=true
